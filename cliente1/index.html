<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    
    <!-- Redirecionamento de segurança (Caso o JS esteja desligado) -->
    <meta http-equiv="refresh" content="0;url=https://google.com">
    
    <script>
        // Redirecionamento principal (Mais rápido)
        window.location.href = "https://google.com";
    </script>
</head>
<body>
    <p>Se você não for redirecionado automaticamente, <a href="https://google.com">clique aqui</a>.</p>
</body>
</html>
